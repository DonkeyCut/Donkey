name: Deploy Cut Worker

# Builds the Cut render worker bundle and deploys it to Cloudflare Containers
# (Worker shell + container image) whenever the worker or the pipeline code it
# reuses changes. Wrangler builds the image from site/src/cut/worker/Dockerfile
# and pushes it to Cloudflare's registry as part of the deploy.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - site/src/cut/worker/**
      # The worker bundles the editor's own library for headless runs, so a
      # change to the drawing, decoding or effects code ships in this image.
      - site/src/cut/lib/**
      - site/packages/effects-kit/**
      - site/scripts/fetch-cut-fonts.mjs
      - site/src/cut/server/exportPipeline.ts
      - site/src/cut/server/exportPipeline.e2e.test.ts
      - site/src/cut/server/filterGraph.ts
      - site/src/cut/server/hlsLadder.ts
      - site/src/cut/server/urlDownload.ts
      - site/src/cut/server/jobs.ts
      - site/src/cut/server/util.ts
      - site/src/cut/server/cloud/ladderStore.ts
      - site/src/cut/server/cloud/r2.ts
      - site/src/cut/server/cloud/httpRange.ts
      - site/prisma/**
      - .github/workflows/deploy-cut-worker.yml

permissions:
  contents: read

concurrency:
  group: deploy-cut-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Bundle worker
        run: npm run worker:build

      # Render the export test project through the same runExport the container
      # runs (site/src/cut/server/exportPipeline.e2e.test.ts), against a Linux
      # GPL ffmpeg like the image's Debian build. A graph the container's
      # ffmpeg family rejects fails the deploy here.
      - name: Render the export test project
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          bun test src/cut/server/exportPipeline.e2e.test.ts

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          command: deploy -c src/cut/worker/wrangler.jsonc
