name: Analytics Contract

# The phone decodes the analytics summary the site folds out of the back
# office's nightly rollup. The site test folds a checked-in rollup fixture,
# a copy of the one the back office's own test builds with its pipeline, and
# fails when the phone's fixtures are behind it; the DonkeyKit tests decode
# those. Together they fail any change that moves the summary's shape without
# the phone's model moving with it.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - site/**
      - apps/ios/DonkeyKit/**
      - .github/workflows/analytics-contract.yml
  push:
    branches: [main]
    paths:
      - site/**
      - apps/ios/DonkeyKit/**
      - .github/workflows/analytics-contract.yml

permissions:
  contents: read

concurrency:
  group: analytics-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Site analytics tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: ./node_modules/.bin/bun test src/lib/analytics

  donkeykit:
    name: DonkeyKit tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Test
        working-directory: apps/ios/DonkeyKit
        run: swift test
