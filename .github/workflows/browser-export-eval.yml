name: Browser Export Eval

# Renders the export eval project through the browser pipeline — framePlan,
# FrameCompositor, WebCodecs, the mediabunny muxer, the audio mix — in a real
# Chrome against a hermetic dev server (scripts/eval-cut-export.ts --hermetic).
# Every API call is answered inside the browser context. The server renders
# the pages, and the root layout reads settings, so it gets a throwaway
# Postgres with the schema and no rows: every setting reads its default.
#
# The job runs on a Mac: the default delivery is H.264 + AAC, and Chrome
# encodes AAC through the platform's encoder, which Linux has none of. A Linux
# Chrome hands that export to the worker, so only a Mac renders it in the tab.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - site/src/cut/lib/**
      - site/packages/effects-kit/**
      - site/scripts/eval-cut-export.ts
      - .github/workflows/browser-export-eval.yml

permissions:
  contents: read

concurrency:
  group: browser-export-eval
  cancel-in-progress: true

jobs:
  eval:
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Install ffmpeg
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install ffmpeg

      # macOS runners take no service containers, so Postgres comes from
      # Homebrew, whose install already initialized a cluster for this user.
      - name: Start Postgres
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install postgresql@17
          brew services start postgresql@17
          for i in $(seq 1 30); do
            if "$(brew --prefix postgresql@17)/bin/pg_isready" -h localhost -q; then break; fi
            sleep 1
          done
          "$(brew --prefix postgresql@17)/bin/createdb" -h localhost donkey

      # Placeholder values: the hermetic eval answers every API call inside
      # the browser context, so nothing on the server ever reads these — they
      # only have to exist for the dev server to boot. The database is the
      # throwaway one above.
      - name: Write placeholder env
        run: |
          for key in BETTER_AUTH_SECRET GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET \
            R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY \
            CUT_MEDIA_SIGNING_SECRET; do
            echo "$key=placeholder" >> .env
          done
          echo "DATABASE_URL=postgresql://$USER@localhost:5432/donkey" >> .env
          echo "DIRECT_URL=postgresql://$USER@localhost:5432/donkey" >> .env

      # The schema only, into the database this job made and drops with it.
      - name: Create the tables
        run: npx prisma db push

      - name: Start dev server
        run: |
          npm run dev > /tmp/next-dev.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3000/api/health; then exit 0; fi
            sleep 2
          done
          echo "dev server never answered" >&2
          tail -50 /tmp/next-dev.log >&2
          exit 1

      - name: Render the eval project in Chrome
        run: npm run eval:cut-export -- --hermetic

      - name: Dev server log on failure
        if: failure()
        run: tail -100 /tmp/next-dev.log
